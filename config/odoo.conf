[options]
; -----------------------------------------------------------------------------
; Odoo 19 Community — local development configuration
; Mounted read-only into the container at /etc/odoo/odoo.conf
; -----------------------------------------------------------------------------

; Network
admin_passwd = admin
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = False

; Database (HOST/USER/PASSWORD also passed via Docker env for the entrypoint)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Leave db_name empty so the database manager is shown on first visit (Odoo 19: comma-list type)
db_name =
db_template = template0
db_maxconn = 64
list_db = True

; Addons: custom path first, then core community addons
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Data directory (filestore, sessions) — backed by Docker volume
data_dir = /var/lib/odoo

; -----------------------------------------------------------------------------
; Developer-friendly logging
; -----------------------------------------------------------------------------
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO
; Uncomment for deeper SQL / ORM debugging while developing modules:
; log_handler = odoo.sql_db:INFO,odoo.models:DEBUG,:INFO
; Empty = do not mirror logs into a PostgreSQL database
log_db =
log_db_level = warning

; Without workers, --dev=reload works and longpolling runs in-process
workers = 0
max_cron_threads = 1

; Safety / DX defaults for local work
without_demo = False
server_wide_modules = base,web
